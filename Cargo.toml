[package]
name = "antiword-rust"
version = "0.1.0"
edition = "2021"
authors = ["antiword-rust contributors"]
description = "Fast, parallelized DOC to text converter written in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
walkdir = "2.5"
anyhow = "1.0"
cfb = "0.9"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3.10"
